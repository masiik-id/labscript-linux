version: '3.8'

services:
  db:
    container_name: postgres16  # Set the container name
    image: postgres:16-bullseye
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret_postgres
      POSTGRES_DB: mydatabase  # Ganti nama database sesuai kebutuhan Anda
      POSTGRES_MAX_CONNECTIONS: 100
      POSTGRES_SHARED_BUFFERS: '256MB'
      POSTGRES_WORK_MEM: '4MB'
      POSTGRES_MAINTENANCE_WORK_MEM: '64MB'
      POSTGRES_EFFECTIVE_CACHE_SIZE: '512MB'
      POSTGRES_WAL_LEVEL: replica
      POSTGRES_SYNCHRONOUS_COMMIT: on
      POSTGRES_TZ: 'Asia/Jakarta'  # Atur zona waktu ke Asia/Jakarta
      POSTGRES_LOGGING_COLLECTOR: 'on'  # Mengaktifkan pengumpulan log
      POSTGRES_LOG_DIRECTORY: 'pg_log'  # Direktori untuk log
      POSTGRES_LOG_FILENAME: 'postgresql-%Y-%m-%d_%H%M%S.log'  # Format nama file log
      POSTGRES_LOG_STATEMENT: 'none'  # Hanya log info dan error
      POSTGRES_LOG_MIN_MESSAGES: 'info'  # Hanya log pesan dengan level info dan lebih tinggi
      POSTGRES_LOG_MIN_ERROR_STATEMENT: 'error'  # Log pernyataan yang menghasilkan error
      POSTGRES_LOG_ROTATION_SIZE: '10MB'  # Maksimum ukuran file log
    volumes:
      - ./data:/var/lib/postgresql/data
      - ./logs:/var/lib/postgresql/pg_log  # Volume untuk log PostgreSQL
    ports:
      - "5432:5432"
